name: Pages

# Publishes the live demo (scripts/build_demo.py: the dashboard running in the browser with
# made-up data) to https://brorlandi.github.io/miscale-dashboard/.
#
# GitHub Pages is not enabled on this repository yet, so this workflow only runs by hand.
# To turn it on:
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions".
#      (Pages on a private repository needs a paid plan: GitHub Pro, Team or Enterprise.)
#   2. Actions > Pages > Run workflow.
#   3. Optional: to publish on every push to main, add under `on:`
#        push:
#          branches: [main]

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_demo.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
