services:
  yunmai:
    build: .
    image: yunmai-dashboard:local
    container_name: yunmai-dashboard
    restart: unless-stopped
    # Every setting (timezone, notifications, the optional AI weekly analysis with
    # YUNMAI_AI_API_KEY, YUNMAI_AI_BASE_URL, YUNMAI_AI_MODEL...) goes in .env; see .env.example.
    env_file:
      - path: .env
        required: false
    ports:
      - "8800:8800"
    volumes:
      # Database and profile photos.
      - ./data:/data
      # The BLE scanner talks to the host's BlueZ over the system D-Bus.
      - /run/dbus:/run/dbus:ro
    security_opt:
      # Docker's default AppArmor profile blocks D-Bus ("AccessDenied ... AddMatch").
      - apparmor=unconfined
